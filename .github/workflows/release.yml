name: Release

# Build distributable artifacts and publish a GitHub Release when a version tag
# is pushed (review #8). Artifact-only by default — no registry credentials
# required; PyPI/npm publishing is tracked in ROADMAP.md.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build artifacts + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build orchestrator wheel + sdist
        working-directory: services/orchestrator
        run: |
          python -m pip install --upgrade pip build
          python -m build
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp dist/* "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Build dashboard (standalone) and package it
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
          tar -czf "$GITHUB_WORKSPACE/artifacts/die-firma-dashboard-${GITHUB_REF_NAME}.tar.gz" dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*
