# =========================================================================
# Die Firma — central configuration (read by Python via stdlib tomllib).
# The locked architecture lives here: models, limits, concurrency, paths.
# Secrets NEVER live here — those come from .env only.
# =========================================================================

[general]
# Filesystem is the single source of truth for orchestration.
inbox_dir   = "inbox"
outbox_dir  = "outbox"
work_dir    = "work"
runlog_dir  = "runlog"
state_dir   = "state"
# How often the watcher polls inbox/ for new *.md drops (seconds).
poll_interval_seconds = 2.0
# UI/CLI language (review §5): "en" or "de" (catalogues in die_firma/locales/
# and apps/dashboard/src/lib/i18n.ts). Override with DIE_FIRMA_LANG.
language = "en"

[dashboard]
# Read-model + ingest live here. Loopback only (prompt §7).
url = "http://127.0.0.1:4321"

[executor]
# "ollama"      -> fully LOCAL via an Ollama server (default; no API key, free).
# "mock"        -> deterministic, no server/key; used for tests + E2E + demo.
# "claude_code" -> spawns `claude -p ... --output-format stream-json`
#                  under firejail with a path whitelist (cloud, needs a key).
# Override at runtime with DIE_FIRMA_EXECUTOR_MODE (CI/demo force "mock").
mode = "ollama"
# Sandbox wrapper for the claude_code executor. If firejail is missing the
# executor refuses to run real workers (fail-closed) unless allow_unsandboxed.
firejail_bin = "firejail"
allow_unsandboxed = false

[ollama]
# Local Ollama server. Install: https://ollama.com  ·  pull a model first, e.g.
#   ollama pull llama3.2        (general)   /   ollama pull qwen2.5-coder  (code)
# Override with DIE_FIRMA_OLLAMA_URL / DIE_FIRMA_OLLAMA_MODEL.
url = "http://localhost:11434"
# Default model when a task type has no specific override below.
# qwen3-coder is a 30B-A3B MoE (~3.3B active/token): built for agentic, multi-
# step coding. On 8GB VRAM it offloads to CPU/RAM, but the MoE keeps it usable.
model = "qwen3-coder:30b"
# On a retry the router escalates here — a reasoning model gets a second,
# stronger attempt after the first model already failed ("Route-to-Reason").
escalation_model = "deepseek-r1:14b"
# Per-request timeout for a single model call (seconds). A hung/slow model
# aborts here instead of blocking a worker forever (review §4). Override with
# DIE_FIRMA_OLLAMA_TIMEOUT.
timeout_seconds = 600.0
# On a timeout/connection error the worker retries ONCE with this smaller,
# faster model before giving up. Empty string disables the fallback hop.
fallback_model = ""
# Last resort when even the fallback is unreachable: emit a clearly-marked
# heuristic placeholder so the pipeline keeps flowing offline instead of
# hard-failing the job. Off by default (a hard failure is usually what you want).
offline_fallback = false

# Best installed model per task type — the worker always uses the model that
# fits the topic. Edit freely to any model you've pulled (`ollama list`).
#   code_gen / code_review / automation -> a code-specialised model
#   data_prep                           -> a strong general/reasoning model
[ollama.models]
code_gen    = "qwen3-coder:30b"
code_review = "qwen3-coder:30b"
automation  = "qwen3-coder:30b"
data_prep   = "qwen3-coder:30b"

# Per-ROLE models for the router. On 8GB VRAM, model swapping (reloading a big
# model from disk on every role change) is the main bottleneck — so code,
# review and general all share ONE model (qwen3-coder), keeping the normal
# code->review->refine path swap-free. Reasoning (only on retry) and vision
# (only for web visual critique) load their specialist models on demand.
[ollama.roles]
code    = "qwen3-coder:30b"
review  = "qwen3-coder:30b"
reason  = "deepseek-r1:14b"
general = "qwen3-coder:30b"
vision  = "llava:7b"

[cache]
# Result cache (review §3): replay artifacts when the exact same sub-task input
# recurs (re-run, duplicated step, unchanged dependency) instead of re-calling
# the model. Content-addressed (SHA-256 of type+task+action+model+context).
enabled = true
# Cache location, relative to the repo root.
dir = "state/cache"

[plugins]
# Task plugin discovery (review §1): every *.py in this directory is imported at
# startup and may register a TaskPlugin (custom decomposition + an extra
# acceptance validator) — extend behaviour without touching the core. See
# tasks/README.md. Relative to the repo root.
dir = "tasks"

[concurrency]
# Semaphore: max parallel tasks. Locked start value = 2 (prompt §1).
max_parallel_tasks = 2
# Adaptive parallelism (review §2): when true, size the worker pool to the
# current machine instead of a fixed semaphore — back off under CPU load / tight
# VRAM, scale up (to adaptive_ceiling) when idle. Off by default to preserve the
# locked, deterministic baseline.
adaptive = false
# Never drop below this many workers.
min_parallel = 1
# Hard upper bound when scaling up. Defaults to max_parallel_tasks, so adaptive
# only *reduces* until you raise this to use more of the box.
adaptive_ceiling = 2
# Approx VRAM a single worker's model needs (MiB). >0 caps concurrency so the
# running workers fit in free VRAM (read via nvidia-smi). 0 disables the cap.
vram_per_worker_mb = 0

[retry]
# Sentinel retry policy: 3 attempts, exponential backoff (prompt §1).
max_attempts = 3
backoff_seconds = [2, 4, 8]

[cost]
# Hard daily USD limit. Orchestrator queries the day total before each
# dispatch and pauses the queue when reached (prompt §1 / §7).
daily_usd_limit = 10.0

[models]
# Model defaults — verify availability against `claude --model` / Anthropic
# docs. Tiered to keep cost down (prompt §2).
worker     = "claude-opus-4-8"      # strongest available Opus tier
dispatcher = "claude-sonnet-4-6"    # Sonnet tier
reviewer   = "claude-sonnet-4-6"    # Sonnet tier
sentinel   = "claude-haiku-4-5"     # Haiku tier

[approval]
# Approval-gate trigger: priority 1 always gates; tasks may also opt in via
# requires_approval: true in their frontmatter.
gate_priority = 1

[quality]
# Quality gate (real review): a reviewer model scores each deliverable against a
# rubric and findings are fed back into refine passes until it passes or the
# pass budget is spent. For web deliverables a vision model also critiques a
# rendered screenshot. Set enabled=false to fall back to verify-only review.
enabled = true
min_score = 75          # accept threshold (0-100)
max_refine_passes = 3   # how many times we may rewrite to fix findings
visual = true           # render + VLM-critique web pages (needs llava + chromium)
