[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "die-firma-orchestrator"
version = "0.2.0"
description = "Die Firma — autonomous agency orchestrator (Python side)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Die Firma" }]
keywords = ["llm", "agents", "orchestrator", "ollama", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "pydantic>=2.13.4",
  "httpx>=0.28.1",
  "anthropic>=0.105.2",
  "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/beko2210/die_firma"
Repository = "https://github.com/beko2210/die_firma"
Changelog = "https://github.com/beko2210/die_firma/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "types-PyYAML",
  "watchdog>=4",
]
# Mutation testing (review §7): verifies the *tests* actually catch logic bugs,
# not just that lines are executed. Optional + non-blocking — run via
# `scripts/mutation.sh` or `mutmut run`. Kept out of `dev` so the default CI
# install stays lean.
mutation = [
  "mutmut>=2.5",
]
# Event-driven inbox watching (review §4). Optional: without it the orchestrator
# falls back to polling. Install with `pip install -e ".[watch]"`.
watch = [
  "watchdog>=4",
]

[project.scripts]
die-firma = "die_firma.cli:main"

[tool.setuptools.packages.find]
include = ["die_firma*"]

[tool.setuptools.package-data]
# Ship the i18n catalogues with the package (review §5).
die_firma = ["locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# Third-party libs without bundled stubs / optional deps absent in CI.
[[tool.mypy.overrides]]
module = ["anthropic.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = """
  --cov=die_firma
  --cov-report=term-missing
  --cov-fail-under=85
"""
testpaths = ["tests"]

[tool.coverage.run]
# llm.py is the live Anthropic SDK wrapper; it is exercised only against the
# real API (Phase 3+), never in the keyless mock test run.
omit = ["die_firma/llm.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mutmut]
# Mutate the pure, logic-heavy core; the tests must kill the mutants. The live
# SDK wrapper and CLI glue are excluded (exercised only end-to-end).
paths_to_mutate = "die_firma/"
tests_dir = "tests/"
runner = "python -m pytest -x -q --no-cov"
