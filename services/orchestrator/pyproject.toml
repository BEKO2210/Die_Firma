[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "die-firma-orchestrator"
version = "0.1.0"
description = "Die Firma — autonomous agency orchestrator (Python side)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.4",
  "httpx>=0.28.1",
  "anthropic>=0.105.2",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "types-PyYAML",
]
# Mutation testing (review §7): verifies the *tests* actually catch logic bugs,
# not just that lines are executed. Optional + non-blocking — run via
# `scripts/mutation.sh` or `mutmut run`. Kept out of `dev` so the default CI
# install stays lean.
mutation = [
  "mutmut>=2.5",
]

[project.scripts]
die-firma = "die_firma.cli:main"

[tool.setuptools.packages.find]
include = ["die_firma*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# Third-party libs without bundled stubs / optional deps absent in CI.
[[tool.mypy.overrides]]
module = ["anthropic.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = """
  --cov=die_firma
  --cov-report=term-missing
  --cov-fail-under=85
"""
testpaths = ["tests"]

[tool.coverage.run]
# llm.py is the live Anthropic SDK wrapper; it is exercised only against the
# real API (Phase 3+), never in the keyless mock test run.
omit = ["die_firma/llm.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mutmut]
# Mutate the pure, logic-heavy core; the tests must kill the mutants. The live
# SDK wrapper and CLI glue are excluded (exercised only end-to-end).
paths_to_mutate = "die_firma/"
tests_dir = "tests/"
runner = "python -m pytest -x -q --no-cov"
